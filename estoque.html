<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Estoque</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <a href="index.html" class="voltar">
            ← Voltar para início
        </a>

        <header>
            <h1>Controle de Estoque</h1>

            <p>
                Registre entradas e saídas e acompanhe
                o saldo atualizado dos produtos.
            </p>
        </header>

        <section class="card">

            <h2>Nova movimentação</h2>

            <form id="formMovimentacao" autocomplete="off">

                <div class="campo">
                    <label for="produto">Produto</label>

                    <select id="produto" required>
                        <option value="">Selecione um produto</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Estoque atual</label>

                    <div id="estoqueAtual" class="estoque-atual">
                        Selecione um produto
                    </div>
                </div>

                <div class="campo">
                    <label for="tipo">Tipo de movimentação</label>

                    <select id="tipo" required>
                        <option value="">Selecione</option>
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saída</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>

                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        step="1"
                        placeholder="Digite a quantidade"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>

                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex: Compra de fornecedor"
                        required
                    >
                </div>

                <button type="submit">
                    Registrar movimentação
                </button>

            </form>

            <!-- Mensagens de sucesso ou erro -->
            <div id="mensagem"></div>

        </section>


        <section class="card">

            <h2>Estoque atual</h2>

            <div class="tabela-container">

                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Produto</th>
                            <th>Estoque</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaEstoque"></tbody>
                </table>

            </div>

        </section>


        <section class="card">

            <h2>Histórico de movimentações</h2>

            <div class="tabela-container">

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Código</th>
                            <th>Produto</th>
                            <th>Tipo</th>
                            <th>Quantidade</th>
                            <th>Descrição</th>
                            <th>Estoque final</th>
                        </tr>
                    </thead>

                    <tbody id="historicoMovimentacoes"></tbody>
                </table>

            </div>

        </section>

    </main>

    <script src="estoque.js"></script>

</body>

</html>
