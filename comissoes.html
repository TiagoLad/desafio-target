<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comissão de Vendedores</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <main class="container">

        <a href="index.html" class="voltar">
            ← Voltar para início
        </a>

        <header>

            <h1>
                Comissão de Vendedores
            </h1>

            <p>
                Resumo das vendas e cálculo das comissões
                do time comercial.
            </p>

        </header>

        <section class="card">

            <h2>
                Resumo de comissões
            </h2>

            <div class="tabela-container">

                <table>
                    <thead>
                        <tr>
                            <th>Vendedor</th>
                            <th>Quantidade de vendas</th>
                            <th>Total vendido</th>
                            <th>Comissão</th>
                        </tr>
                    </thead>

                    <tbody id="resultado">
                    </tbody>
                </table>

            </div>

        </section>

        <script src="script.js"></script>

</body>

</html>
